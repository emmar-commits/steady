<body>
<title>Steady Health Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky brand bar on top, fixed tab bar at the bottom; cards only for things you act on. */
/* Single light look by request: blush ground, berry accent, peach for streaks. */
:root {
  --bg: #FCF5F7;
  --surface: #FFFFFF;
  --surface-2: #F7EAEF;
  --ink: #33202C;
  --muted: #86707D;
  --line: #F0DEE6;
  --primary: #A8457A;
  --primary-ink: #FFFFFF;
  --primary-soft: #F8E2ED;
  --sun: #E08A55;
  --sun-soft: #FDEADF;
  --rose: #E0709B;
  --rose-soft: #FCE4EE;
  --danger: #B93445;
  --danger-soft: #FAE1E4;
  --warn: #B47C2A;
  --ok: #3F8C6C;
  --chart-2: #8A78CF;
  --shadow: 0 1px 2px rgba(120,50,85,.05), 0 8px 24px rgba(120,50,85,.07);
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 18px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; line-height: 1.15; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.mark { width: 28px; height: 28px; border-radius: 50%; background: repeating-linear-gradient(135deg, var(--primary) 0 3px, var(--rose-soft) 3px 7px); box-shadow: inset 0 0 0 2px var(--primary); }
.brand { font-style: italic; color: var(--primary); }
.sync { margin-left: auto; font-size: .75rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync[data-s="ok"] i { background: var(--ok); }
.sync[data-s="local"] i { background: var(--warn); }
.sync[data-s="err"] i { background: var(--danger); }

main { padding-block: 18px 120px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 10px; }

/* Day header */
.dayhead { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.daynav { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.iconbtn { width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn[disabled] { opacity: .35; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--ink); border: 0; }
.pill.sun { background: var(--sun-soft); color: var(--ink); }
.pill.sun b { color: var(--sun); }
.pill.flare { background: var(--danger-soft); color: var(--danger); }
.pill.link { background: var(--primary-soft); color: var(--primary); }
.pill.cyc { background: var(--rose-soft); color: var(--primary); }
.chips.rose .chip[aria-pressed="true"] { background: var(--rose-soft); border-color: var(--rose); color: var(--primary); }
.cell.period::before { content: ""; position: absolute; left: 2px; bottom: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 1.5px var(--surface); }
.ring { position: relative; width: 92px; height: 92px; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1; }
.ring .val small { display: block; font-family: var(--font-body); font-size: .65rem; font-weight: 600; color: var(--muted); margin-top: 3px; letter-spacing: .04em; }
.quote { font-size: .92rem; color: var(--muted); margin-top: 8px; max-width: 40ch; }

/* Checklist */
.group { display: flex; flex-direction: column; }
.group + .group { margin-top: 12px; }
.check { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border: 0; background: none; text-align: left; width: 100%; border-bottom: 1px solid var(--line); }
.group .check:last-child { border-bottom: 0; }
.box { flex: none; width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.box svg { width: 15px; height: 15px; opacity: 0; stroke: var(--primary-ink); }
.check[aria-pressed="true"] .box { background: var(--primary); border-color: var(--primary); }
.check[aria-pressed="true"] .box svg { opacity: 1; }
.check[aria-pressed="true"] .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.check .txt { min-width: 0; flex: 1; }
.check .nm { font-weight: 600; display: block; }
.check .dt { font-size: .8rem; color: var(--muted); display: block; }
.tag { flex: none; font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.check.on .box { background: var(--primary); border-color: var(--primary); }
.check.on .box svg { opacity: 1; }
.vchips { margin-top: 8px; }
.vchips .chip { padding: 5px 11px; font-size: .8rem; }
.card.alert { background: var(--sun-soft); box-shadow: none; }
.ostats { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 12px 10px; margin-top: 12px; }
.ostats b { display: block; font-family: var(--font-display); font-size: 1.3rem; line-height: 1.1; }
.ostats b small { font-family: var(--font-body); font-size: .7rem; color: var(--muted); font-weight: 600; }
.ostats span { font-size: .75rem; color: var(--muted); font-weight: 600; }
.otable { width: 100%; border-collapse: collapse; font-size: .85rem; }
.otable th, .otable td { padding: 7px 4px; text-align: right; border-bottom: 1px solid var(--line); }
.otable th:first-child, .otable td:first-child { text-align: left; }
.otable th { font-size: .72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.upcoming { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.upcoming p { margin: 6px 0 0; font-size: .88rem; }
.upcoming b { color: var(--sun); }
.wt { max-width: 140px; font-size: 1.25rem; font-weight: 700; font-family: var(--font-display); }
.phase { display: grid; grid-template-columns: 1fr 84px auto; gap: 8px; align-items: end; }
.streak-mini { flex: none; font-size: .78rem; font-weight: 700; color: var(--sun); min-width: 28px; text-align: right; }

/* Water */
.water { display: flex; align-items: center; gap: 14px; }
.glasses { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }
.glass { width: 20px; height: 26px; border-radius: 3px 3px 7px 7px; border: 2px solid var(--primary); background: transparent; padding: 0; }
.glass.full { background: var(--primary); }
.stepper { display: flex; gap: 6px; }
.stepper button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 1.2rem; font-weight: 700; }

/* Retainer */
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.bar.due > i { background: var(--sun); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; background: var(--primary); color: var(--primary-ink); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--danger); color: var(--surface); }
.btn.sm { padding: 7px 12px; font-size: .85rem; border-radius: 10px; }

/* Scores */
.score { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding-block: 8px; }
.score + .score { border-top: 1px solid var(--line); }
.score .nm { font-weight: 600; }
.score .hint { font-size: .78rem; color: var(--muted); grid-column: 1 / -1; margin-top: -2px; }
.score .num { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; min-width: 2.2ch; text-align: right; }
.score.unset .num { color: var(--muted); font-size: .8rem; font-family: var(--font-body); font-weight: 600; }
.score input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--primary); height: 28px; }
.score.unset input[type=range] { opacity: .45; }
.score.bad .num { color: var(--danger); }
.score.mid .num { color: var(--warn); }
.score.good .num { color: var(--ok); }

/* Toggles & chips */
.toggle { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 6px 0; text-align: left; }
.toggle .txt { flex: 1; min-width: 0; }
.toggle .nm { font-weight: 600; display: block; }
.toggle .dt { font-size: .8rem; color: var(--muted); display: block; }
.sw { flex: none; width: 46px; height: 28px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); position: relative; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.toggle[aria-pressed="true"] .sw { background: var(--primary); border-color: var(--primary); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(18px); }
.toggle.flare[aria-pressed="true"] .sw { background: var(--danger); border-color: var(--danger); }
.sub { padding: 10px 0 4px; display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.chips.red .chip[aria-pressed="true"] { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.divider { height: 1px; background: var(--line); margin: 8px 0; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: .8rem; font-weight: 600; color: var(--muted); }
input[type=text], input[type=number], input[type=date], select, textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 80px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.counter { display: flex; align-items: center; gap: 10px; }
.counter b { font-family: var(--font-display); font-size: 1.2rem; min-width: 2ch; text-align: center; }

/* Streaks */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; }
.stat span { font-size: .75rem; color: var(--muted); font-weight: 600; }
.stat.sun b { color: var(--sun); }
.heat { display: grid; grid-template-columns: auto repeat(12, 1fr); gap: 4px; align-items: center; }
.heat .dl { font-size: .65rem; color: var(--muted); padding-right: 4px; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 5px; border: 0; padding: 0; position: relative; background: var(--surface-2); }
.cell[data-l="1"] { background: color-mix(in srgb, var(--primary) 25%, var(--surface-2)); }
.cell[data-l="2"] { background: color-mix(in srgb, var(--primary) 50%, var(--surface-2)); }
.cell[data-l="3"] { background: color-mix(in srgb, var(--primary) 75%, var(--surface-2)); }
.cell[data-l="4"] { background: var(--primary); }
.cell.flare::after { content: ""; position: absolute; right: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 1.5px var(--surface); }
.cell.today { box-shadow: 0 0 0 2px var(--sun); }
.cell.future { opacity: .3; cursor: default; }
.legend { display: flex; align-items: center; gap: 6px; font-size: .72rem; color: var(--muted); flex-wrap: wrap; }
.legend .cell { width: 12px; height: 12px; display: inline-block; }
.hrow { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.hrow:last-child { border-bottom: 0; }
.hrow .nm { font-weight: 600; min-width: 0; }
.hrow .v { text-align: right; font-size: .8rem; color: var(--muted); }
.hrow .v b { display: block; font-family: var(--font-display); font-size: 1.1rem; color: var(--ink); }
.hrow .v.sun b { color: var(--sun); }
.goal { display: flex; flex-direction: column; gap: 8px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); display: inline-block; }
.dots i.on { background: var(--sun); }

/* Insights */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.keyline { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); flex-wrap: wrap; }
.keyline i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.finding { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.finding:last-child { border-bottom: 0; padding-bottom: 0; }
.finding:first-child { padding-top: 0; }
.finding .badge { align-self: flex-start; font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
.badge.pattern { background: var(--sun-soft); color: var(--sun); }
.badge.none { background: var(--surface-2); color: var(--muted); }
.badge.wait { background: var(--primary-soft); color: var(--primary); }
.cmp { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: .82rem; }
.cmp .bar { height: 10px; }
.cmp .bar.alt > i { background: var(--danger); }
.cmp .val { font-weight: 700; min-width: 3ch; text-align: right; }
.tally { display: flex; flex-direction: column; gap: 6px; }
.tally .row { flex-wrap: nowrap; }
.tally .row span:first-child { flex: 0 0 120px; font-size: .85rem; }
.tally .bar { flex: 1; }
.tally .row b { width: 2ch; text-align: right; font-size: .85rem; }
.empty { text-align: center; padding: 26px 14px; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: 6px; }
.note { font-size: .78rem; color: var(--muted); }

/* Plan */
.hedit { border-bottom: 1px solid var(--line); padding: 10px 0; }
.hedit:last-child { border-bottom: 0; }
.hedit summary { display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none; font-weight: 600; }
.hedit summary::-webkit-details-marker { display: none; }
.hedit summary .tag { margin-left: auto; }
.hedit .body { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; }
.days { display: flex; gap: 4px; flex-wrap: wrap; }
.days .chip { padding: 6px 0; width: 38px; text-align: center; }
.confirm { background: var(--danger-soft); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .85rem; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: none; padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .72rem; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--primary); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 12px; font-size: .85rem; font-weight: 600; z-index: 9; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 380px) { .stats { grid-template-columns: 1fr 1fr; } h1 { font-size: 1.5rem; } }
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Steady</div>
    <div class="sync" id="sync" data-s="wait"><i></i><span>Connecting…</span></div>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Sections">

    <button class="tab" data-tab="streaks" id="tab-streaks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.7 2.2-4.8.3 1.6 1 2.6 2 3.1C11 9 11.3 5.6 12 3Z"/></svg>Streaks</button>
    <button class="tab" data-tab="insights" id="tab-insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="m5 15 4-5 4 3 6-8"/></svg>Insights</button>
    <button class="tab" data-tab="plan" id="tab-plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>My plan</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";

/* ---------- constants ---------- */
const CATS = { med: "Medication", supp: "Supplement", move: "Movement", rest: "Recovery", pots: "POTS", care: "Care" };
const TIMES = [["morning", "Morning"], ["midday", "Daytime"], ["evening", "Evening"]];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const SCORES = [
  { k: "pain", nm: "Pain", hint: "0 none · 10 worst imaginable", worse: "high" },
  { k: "fatigue", nm: "Fatigue", hint: "0 full energy · 10 can't get up", worse: "high" },
  { k: "fog", nm: "Brain fog", hint: "0 clear · 10 can't think", worse: "high" },
  { k: "dizzy", nm: "Dizziness / POTS", hint: "0 none · 10 near-fainting", worse: "high" },
  { k: "stress", nm: "Stress / overwhelm", hint: "0 calm · 10 overwhelmed", worse: "high" },
  { k: "sleep", nm: "Sleep quality last night", hint: "0 awful · 10 restorative", worse: "low" },
];
const SYMPTOMS = ["Joint pain", "Subluxation", "Muscle spasm", "Fatigue crash", "Dizziness / fainting", "Racing heart", "Brain fog", "Headache / migraine", "Gut upset", "Rash / skin", "Low mood", "Insomnia"];
const TRIGGERS = ["Travel", "Poor sleep", "Stress", "Gluten", "Overexertion", "Heat", "Weather change", "Hormonal", "Illness", "Missed meds", "Long standing", "Alcohol"];
const TRAVEL_TYPES = ["Flight", "Car", "Train", "Bus / coach"];
const QUOTES = [
  "Consistency over intensity. Small things, done often.",
  "Rest is part of the plan, not a break from it.",
  "A flare is information, not failure.",

  if (d.weight != null && prevW) { const ch = toUnit(d.weight) - toUnit(prevW.w); wNote = `${ch === 0 ? "No change" : (ch > 0 ? "+" : "−") + fmt1(Math.abs(ch)) + " " + unit} since ${diffDays(prevW.k, k) === 1 ? "yesterday" : "last entry"}`; }

  const ci = cycleInfo(k);
  const cycNote = !ci ? "Log your period here to track your cycle." : ci.nextIn == null ? "Log two or more periods to get a prediction." : ci.nextIn > 0 ? `Next period expected in about ${ci.nextIn} day${ci.nextIn === 1 ? "" : "s"} (average cycle ${ci.avgLen} days).` : `Period expected around now (average cycle ${ci.avgLen} days).`;
  const f = d.flare, tr = d.travel;
  return `<div class="stack">
    <section class="dayhead">
      <div>
        <div class="label">${k === t ? greeting() : nd.lab}</div>
        <h1>${esc(nd.full)}</h1>
        <div class="daynav">
          <button class="iconbtn" data-act="day" data-n="-1" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button>
          <button class="iconbtn" data-act="day" data-n="1" aria-label="Next day" ${k >= t ? "disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
          ${k !== t ? `<button class="pill link" data-act="day" data-n="0">Back to today</button>` : `<span class="pill sun"><b class="tnum">${st.cur}</b> day steady streak</span>`}
          ${f ? `<span class="pill flare">Flare day</span>` : ""}
          ${ci && ci.dayN <= 60 ? `<span class="pill cyc">Cycle day ${ci.dayN}</span>` : ""}
        </div>
        <p class="quote">${esc(quote)}</p>
      </div>
      <div class="ring" role="img" aria-label="${p.done} of ${p.total} done">
        <svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="none" stroke="var(--surface-2)" stroke-width="9"/><circle cx="46" cy="46" r="40" fill="none" stroke="${p.pct >= 1 ? "var(--sun)" : "var(--primary)"}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p.pct)}"/></svg>
        <div class="val tnum">${p.done}/${p.total}<small>DONE</small></div>
      </div>
    </section>

    ${k === t ? habits().map(h => ({ h, si: stockInfo(h) })).filter(x => x.si && x.si.due).map(({ h, si }) => `<section class="card alert">
      <div class="label" style="color:var(--sun)">Reorder soon</div>
      <h2 style="margin-top:2px">${esc(h.name)}</h2>
      <p style="margin:6px 0 10px">${si.left} ${esc(si.unit)} left${si.lastCovered ? `, enough until ${shortDate(si.lastCovered)}` : ""}. ${si.runOut ? `Next one needed ${shortDate(si.runOut)}.` : ""}</p>
      <div class="row">${si.pack ? `<button class="btn sm" data-act="restock" data-id="${esc(h.id)}">Got a new supply (+${si.pack})</button>` : ""}<button class="btn sm ghost" data-act="editsupply" data-id="${esc(h.id)}">Update supply</button></div>
    </section>`).join("") : ""}

    <section class="card">${checks || `<p class="muted">Nothing scheduled. Add habits in My plan.</p>`}
      ${upcoming.length ? `<div class="upcoming"><div class="label">Coming up</div>${upcoming.map(u => `<p>${u}</p>`).join("")}</div>` : ""}</section>

    <section class="card">
      <div class="row between"><h2>Extras</h2><span class="note">Bonus recovery, never affects streaks</span></div>
      <div class="chips" style="margin-top:10px">${(settings.extras || []).map(x => `<button class="chip" data-act="extra" data-v="${esc(x)}" aria-pressed="${(d.extras || []).includes(x)}">${esc(x)}</button>`).join("") || `<span class="note">Add extras in My plan.</span>`}</div>
    </section>

    <section class="card">
      <div class="row between"><h2>Weight</h2><span class="note tnum">${wNote}</span></div>
      <div class="row" style="margin-top:10px">
        <input type="number" id="wt" class="wt tnum" inputmode="decimal" step="0.1" min="0" data-field="weight" aria-label="Weight in ${unit}" value="${d.weight != null ? fmt1(toUnit(d.weight)) : ""}" placeholder="${prevW ? fmt1(toUnit(prevW.w)) : "0.0"}">
        <span class="muted" style="font-weight:600">${unit}</span>
      </div>
      <p class="note" style="margin:8px 0 0">Weigh at the same time each day, ideally on waking before food, so days compare fairly.</p>
    </section>

    <section class="card">
      <div class="row between"><h2>Hydration</h2><span class="muted tnum">${((d.water || 0) * settings.water.glassMl / 1000).toFixed(2).replace(/0$/, "")} / ${(settings.water.targetMl / 1000).toFixed(1)} L</span></div>
      <div class="water" style="margin-top:10px">
        <div class="glasses" aria-label="${d.water || 0} of ${g} glasses">${[...Array(Math.max(g, d.water || 0))].map((_, i) => `<span class="glass ${i < (d.water || 0) ? "full" : ""}"></span>`).join("")}</div>
        <div class="stepper"><button data-act="water" data-n="-1" aria-label="Remove a glass">−</button><button data-act="water" data-n="1" aria-label="Add a glass">+</button></div>
      </div>
      <p class="note" style="margin:8px 0 0">${settings.water.glassMl} ml per glass. Fluids and salt help keep POTS symptoms down.</p>

    <section class="card">
      <div class="row between"><h2>Retainers</h2><span class="pill ${ri.due ? "sun" : ""}">Set ${settings.retainer.set}</span></div>
      <p style="margin:8px 0">${ri.due ? `<b>Swap due${ri.left < 0 ? ` (${-ri.left} day${ri.left === -1 ? "" : "s"} over)` : " today"}.</b>` : `Day ${ri.dayN} of ${settings.retainer.interval}. Next swap in <b>${ri.left} day${ri.left === 1 ? "" : "s"}</b>.`}</p>
      <div class="bar ${ri.due || ri.soon ? "due" : ""}"><i style="width:${ri.pct * 100}%"></i></div>
      <div class="row" style="margin-top:12px"><button class="btn sm ${ri.due ? "" : "ghost"}" data-act="swap">Swapped to set ${settings.retainer.set + 1}</button></div>
    </section>

    ${ouraTodayCard(d)}

    <div class="section-head"><h2>How you feel</h2><span class="note">Slide to log</span></div>

    <div class="section-head"><h2>Cycle</h2></div>
    <section class="card">
      <div class="field"><span>Period</span><div class="chips rose">${[["", "None"], ["spot", "Spotting"], ["light", "Light"], ["medium", "Medium"], ["heavy", "Heavy"]].map(([v, l]) => `<button class="chip" data-act="period" data-v="${v}" aria-pressed="${(d.period || "") === v}">${l}</button>`).join("")}</div></div>
      <div class="field" style="margin-top:12px"><span>Cycle symptoms</span><div class="chips rose">${["Cramps", "Bloating", "Breast tenderness", "Mood swings", "Hormonal headache", "Hot flushes", "Night sweats"].map(s => `<button class="chip" data-act="csx" data-v="${s}" aria-pressed="${(d.cycleSx || []).includes(s)}">${s}</button>`).join("")}</div></div>
