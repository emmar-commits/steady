      <button class="toggle flare" data-act="flare" aria-pressed="${!!f}"><span class="txt"><span class="nm">Flare-up</span><span class="dt">Flare days pause your streaks instead of breaking them</span></span><span class="sw"></span></button>
      ${f ? `<div class="sub">
        <div class="field"><span>Severity</span><div class="chips red">${["Mild", "Moderate", "Severe"].map(s => `<button class="chip" data-act="fsev" data-v="${s}" aria-pressed="${f.severity === s}">${s}</button>`).join("")}</div></div>
        <div class="field"><span>Symptoms</span><div class="chips red">${SYMPTOMS.map(s => `<button class="chip" data-act="fsym" data-v="${esc(s)}" aria-pressed="${(f.symptoms || []).includes(s)}">${s}</button>`).join("")}</div></div>
        <div class="field"><span>Possible triggers</span><div class="chips">${TRIGGERS.map(s => `<button class="chip" data-act="ftrig" data-v="${esc(s)}" aria-pressed="${(f.triggers || []).includes(s)}">${s}</button>`).join("")}</div></div>
      </div>` : ""}
      <div class="divider"></div>
      <button class="toggle" data-act="travel" aria-pressed="${!!tr}"><span class="txt"><span class="nm">Travel day</span><span class="dt">Compared against pain and flares over the next 3 days</span></span><span class="sw"></span></button>
      ${tr ? `<div class="sub">
        <div class="chips">${TRAVEL_TYPES.map(s => `<button class="chip" data-act="ttype" data-v="${s}" aria-pressed="${tr.type === s}">${s}</button>`).join("")}</div>
        <div class="grid2">
          <label class="field" for="tr-hours"><span>Hours travelling</span><input type="number" id="tr-hours" min="0" step="0.5" inputmode="decimal" data-field="travel.hours" value="${tr.hours ?? ""}"></label>
          <label class="field" for="tr-tz"><span>Time zones crossed</span><input type="number" id="tr-tz" min="0" step="1" inputmode="numeric" data-field="travel.tz" value="${tr.tz ?? ""}"></label>
        </div>
      </div>` : ""}
      <div class="divider"></div>
      <div class="field" style="padding:6px 0"><span>Gluten exposure</span><div class="chips">${[["none", "None"], ["maybe", "Possible"], ["yes", "Yes"]].map(([v, l]) => `<button class="chip" data-act="gluten" data-v="${v}" aria-pressed="${(d.gluten || "none") === v}">${l}</button>`).join("")}</div></div>
      <div class="divider"></div>
      <div class="row between" style="padding:6px 0"><div><div style="font-weight:600">Subluxations / dislocations</div><div class="note">Count for the day</div></div>
        <div class="counter"><div class="stepper"><button data-act="sublux" data-n="-1" aria-label="Fewer">−</button></div><b class="tnum">${d.sublux || 0}</b><div class="stepper"><button data-act="sublux" data-n="1" aria-label="More">+</button></div></div></div>
    </section>

    <label class="field" for="notes"><span class="label">Notes</span><textarea id="notes" data-field="notes" placeholder="Anything worth remembering: what you ate, weather, appointments, wins.">${esc(d.notes)}</textarea></label>
  </div>`;
}

function vStreaks() {
  const t = todayKey(), st = steadyStreak();
  const sk = startKey();
  const logged = Object.keys(days).filter(k => meaningful(days[k]));
  const last30 = [...Array(30)].map((_, i) => addDays(t, -i)).filter(k => k >= sk);
  const consistency = last30.length ? Math.round(avg(last30.map(k => dayProgress(k).pct)) * 100) : 0;

  // heatmap: 12 weeks, Monday-start columns
  const wk = weekKeys(t)[0];
  const cols = [...Array(12)].map((_, i) => addDays(wk, (i - 11) * 7));
  let heat = "";
  for (let r = 0; r < 7; r++) {
    heat += `<span class="dl">${r % 2 === 0 ? ["Mon", "", "Wed", "", "Fri", "", "Sun"][r] : ""}</span>`;
    for (const c of cols) {
      const k = addDays(c, r);
      if (k > t) { heat += `<span class="cell future"></span>`; continue; }
      const pct = hasDay(k) ? dayProgress(k).pct : 0;
      const l = pct === 0 ? 0 : pct < .34 ? 1 : pct < .67 ? 2 : pct < 1 ? 3 : 4;
      heat += `<button class="cell ${isFlare(k) ? "flare" : ""} ${isPeriod(k) ? "period" : ""} ${k === t ? "today" : ""}" data-l="${l}" data-act="goto" data-k="${k}" aria-label="${k}: ${Math.round(pct * 100)}% done${isFlare(k) ? ", flare" : ""}"></button>`;
    }
  }

  // weekly goals
  const wks = weekKeys(t);
  const sh = habits().find(h => h.id === settings.goals.strengthHabit);
  const strengthDone = sh ? wks.filter(k => days[k] && days[k].done[sh.id]).length : 0;
  const target = settings.goals.strengthPerWeek || 3;
  const hydraDays = wks.filter(k => k <= t && days[k] && (days[k].water || 0) >= waterGlasses()).length;
  const elapsedWk = wks.filter(k => k <= t).length;

  const mix = h => {
    if (!h.variants || !h.variants.length) return "";
    const c = {}; [...Array(30)].map((_, i) => addDays(t, -i)).forEach(k => vlist(days[k] && days[k].done[h.id]).forEach(v => c[v] = (c[v] || 0) + 1));
    const parts = Object.entries(c).map(([n, x]) => `${esc(n)} ${x}`);
    return parts.length ? `<br><span class="note">Last 30 days: ${parts.join(" · ")}</span>` : "";
  };
  const rows = habits().map(h => ({ h, s: habitStreak(h) })).sort((a, b) => b.s.cur - a.s.cur).map(({ h, s }) =>
    `<div class="hrow"><span class="nm">${esc(h.name)}<br><span class="note">${esc(schedText(h))}</span>${mix(h)}</span>
      <span class="v sun"><b class="tnum">${s.cur}</b>now</span><span class="v"><b class="tnum">${s.best}</b>best</span></div>`).join("");

  return `<div class="stack">
    <div><div class="label">Streaks</div><h1>Showing up, steadily</h1></div>
    <div class="stats">
      <div class="stat sun"><b class="tnum">${st.cur}</b><span>Steady-day streak</span></div>
      <div class="stat"><b class="tnum">${st.best}</b><span>Best streak</span></div>
      <div class="stat"><b class="tnum">${consistency}%</b><span>Last 30 days</span></div>
    </div>
    <p class="note" style="margin:0">A steady day means ${settings.goals.steadyPct || 80}% or more of the day's plan done. Flare days are paused, so resting never costs you a streak.</p>

    <section class="card">
      <div class="row between" style="margin-bottom:12px"><h2>Last 12 weeks</h2><span class="note">Tap a day to open it</span></div>
      <div class="heat">${heat}</div>
      <div class="legend" style="margin-top:12px">Less <span class="cell" data-l="0"></span><span class="cell" data-l="1"></span><span class="cell" data-l="2"></span><span class="cell" data-l="3"></span><span class="cell" data-l="4"></span> More <span style="margin-left:10px" class="cell flare" data-l="0"></span> Flare <span style="margin-left:6px" class="cell period" data-l="0"></span> Period</div>
    </section>

    <section class="card goal">
      <div class="row between"><h2>Toward 2027</h2><span class="note">This week</span></div>
      <div><div class="row between"><span style="font-weight:600">${esc(sh ? sh.name : "Strength")} sessions</span><span class="tnum muted">${strengthDone} of ${target}</span></div>
        <div class="dots" style="margin-top:6px">${[...Array(target)].map((_, i) => `<i class="${i < strengthDone ? "on" : ""}"></i>`).join("")}</div>
        ${(() => { if (!sh || !sh.variants) return ""; const c = {}; wks.forEach(k => vlist(days[k] && days[k].done[sh.id]).forEach(v => c[v] = (c[v] || 0) + 1));
          const p = sh.variants.filter(v => c[v]).map(v => `${esc(v)} ${c[v]}`); return p.length ? `<p class="note" style="margin:6px 0 0">This week: ${p.join(" · ")}</p>` : ""; })()}</div>
      <div><div class="row between"><span style="font-weight:600">Hydration target hit</span><span class="tnum muted">${hydraDays} of ${elapsedWk} days</span></div>
        <div class="bar" style="margin-top:6px"><i style="width:${elapsedWk ? hydraDays / elapsedWk * 100 : 0}%"></i></div></div>
      <p class="note" style="margin:0">Building strength with EDS works best with slow progress and consistent, low-load sessions. Adjust the weekly target in My plan.</p>
    </section>

    <section class="card"><h2 style="margin-bottom:4px">By habit</h2>${rows}</section>
    ${(() => {
      const c = {}; [...Array(30)].map((_, i) => addDays(t, -i)).forEach(k => (days[k] && days[k].extras || []).forEach(x => c[x] = (c[x] || 0) + 1));
      const e = Object.entries(c).sort((a, b) => b[1] - a[1]); if (!e.length) return "";
      const mx = e[0][1];
      return `<section class="card"><div class="row between" style="margin-bottom:10px"><h2>Extras</h2><span class="note">Last 30 days</span></div><div class="tally">${e.map(([n, x]) => `<div class="row"><span>${esc(n)}</span><div class="bar"><i style="width:${x / mx * 100}%;background:var(--rose)"></i></div><b class="tnum">${x}</b></div>`).join("")}</div></section>`;
    })()}
    ${logged.length ? "" : `<p class="note">Your streaks grow as you tick things off on the Today tab.</p>`}
  </div>`;
}

/* ---------- insights ---------- */
function cmpBlock(title, labelA, a, labelB, b, metricName, higherWorse = true, minN = 3) {
  const nA = a.length, nB = b.length;
  if (nA < minN || nB < minN) {
    return `<div class="finding"><span class="badge wait">Gathering data</span><h3>${title}</h3>
      <p class="note" style="margin:0">Needs at least ${minN} logged days in each group. So far: ${nA} ${labelA.toLowerCase()}, ${nB} ${labelB.toLowerCase()}.</p></div>`;
  }
  const mA = avg(a), mB = avg(b), dlt = mA - mB;
  const worse = higherWorse ? dlt : -dlt;
  const badge = worse >= 1 ? `<span class="badge pattern">Possible pattern</span>` : worse <= -1 ? `<span class="badge pattern">Possible pattern</span>` : `<span class="badge none">No clear difference</span>`;
  const sentence = Math.abs(dlt) < 1 ? `Average ${metricName} is about the same (${fmt1(mA)} vs ${fmt1(mB)}).`
    : `Average ${metricName} is <b>${fmt1(Math.abs(dlt))} points ${dlt > 0 ? "higher" : "lower"}</b> ${labelA.toLowerCase()}.`;
  return `<div class="finding">${badge}<h3>${title}</h3><p style="margin:0">${sentence}</p>
    <div class="cmp tnum">
      <span>${labelA} (${nA})</span><span class="val">${fmt1(mA)}</span><div class="bar alt" style="grid-column:1/-1"><i style="width:${mA * 10}%"></i></div>
      <span>${labelB} (${nB})</span><span class="val">${fmt1(mB)}</span><div class="bar" style="grid-column:1/-1"><i style="width:${mB * 10}%"></i></div>
    </div></div>`;
}

function trendChart(keys) {
  const W = 340, H = 154, L = 24, R = 8, T = 12, B = 22;
  const x = i => L + i * (W - L - R) / Math.max(1, keys.length - 1);
  const y = v => T + (10 - v) * (H - T - B) / 10;
  const line = (metric) => {
    let p = "", pen = false;
    keys.forEach((k, i) => {
      const v = days[k] && days[k].scores ? days[k].scores[metric] : null;
      if (v == null) { pen = false; return; }
      p += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1);
      pen = true;
    });
    return p;
  };
  const dots = (metric, col) => keys.map((k, i) => { const v = days[k] && days[k].scores ? days[k].scores[metric] : null; return v == null ? "" : `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.2" fill="${col}"/>`; }).join("");
  let bands = "";
  keys.forEach((k, i) => {
    const w = (W - L - R) / Math.max(1, keys.length - 1);
    if (isFlare(k)) bands += `<rect x="${(x(i) - w / 2).toFixed(1)}" y="${T}" width="${w.toFixed(1)}" height="${H - T - B}" fill="var(--danger)" fill-opacity=".12"/>`;
    if (isPeriod(k)) bands += `<circle cx="${x(i).toFixed(1)}" cy="${T - 3}" r="2.6" fill="var(--rose)"/>`;
    if (days[k] && days[k].travel) bands += `<path d="M${x(i).toFixed(1)} ${H - B + 3} l-3.5 6 h7z" fill="var(--chart-2)"/>`;
  });
  const grid = [0, 5, 10].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join("");
  const xl = [0, Math.floor((keys.length - 1) / 2), keys.length - 1].map(i => { const d = parseKey(keys[i]); return `<text x="${x(i)}" y="${H - 4}" text-anchor="${i === 0 ? "start" : i === keys.length - 1 ? "end" : "middle"}">${d.getDate()} ${d.toLocaleDateString(undefined, { month: "short" })}</text>`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pain and fatigue, last ${keys.length} days">${bands}${grid}
    <path d="${line("fatigue")}" fill="none" stroke="var(--chart-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots("fatigue", "var(--chart-2)")}
    <path d="${line("pain")}" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots("pain", "var(--primary)")}${xl}</svg>`;
}

function weightChart(keys) {
  const pts = keys.map((k, i) => [i, days[k] && days[k].weight != null ? toUnit(days[k].weight) : null]).filter(p => p[1] != null);
  if (pts.length < 2) return "";
  const W = 340, H = 130, L = 34, R = 10, T = 10, B = 22;
  let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  const pad = Math.max(0.5, (hi - lo) * 0.15); lo = Math.floor(lo - pad); hi = Math.ceil(hi + pad);
  const x = i => L + i * (W - L - R) / Math.max(1, keys.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const path = pts.map((p, j) => (j ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(p[1]).toFixed(1)).join("");
  const area = path + `L${x(pts[pts.length - 1][0]).toFixed(1)} ${H - B}L${x(pts[0][0]).toFixed(1)} ${H - B}Z`;
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${fmt1(v)}</text>`).join("");
  const lp = pts[pts.length - 1];
  const xl = [0, keys.length - 1].map(i => { const d = parseKey(keys[i]); return `<text x="${x(i)}" y="${H - 4}" text-anchor="${i === 0 ? "start" : "end"}">${d.getDate()} ${d.toLocaleDateString(undefined, { month: "short" })}</text>`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight, last ${keys.length} days">${grid}
    <path d="${area}" fill="var(--primary)" fill-opacity=".1"/><path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(lp[0])}" cy="${y(lp[1])}" r="4" fill="var(--primary)" stroke="var(--surface)" stroke-width="2"/>${xl}</svg>`;
}

function vInsights() {
  const t = todayKey();
  const all = Object.keys(days).filter(k => k <= t).sort();
  const scored = all.filter(k => days[k].scores && days[k].scores.pain != null);
  const sc = (k, m) => days[k] && days[k].scores ? days[k].scores[m] : null;
  const vals = (ks, m) => ks.map(k => sc(k, m)).filter(v => v != null);
  const keys30 = [...Array(30)].map((_, i) => addDays(t, i - 29));

  if (scored.length < 3) {
    return `<div class="stack"><div><div class="label">Insights</div><h1>Patterns in your days</h1></div>
      <section class="card empty"><h3>Insights appear after a few check-ins</h3>
      <p style="margin:0">Log pain and fatigue on the Today tab for at least 3 days. Mark travel, gluten and flares as they happen. Steady then compares days to look for links, such as pain in the 3 days after travel.</p>
      <p class="note">${scored.length} of 3 days logged so far.</p></section></div>`;
  }

  // windows
  const within = (k, pred, lag) => { for (let i = 0; i <= lag; i++) if (pred(addDays(k, -i))) return true; return false; };
  const trav = k => !!(days[k] && days[k].travel);
  const glu = k => !!(days[k] && (days[k].gluten === "yes" || days[k].gluten === "maybe"));
  const afterTravel = scored.filter(k => within(k, trav, 3));
  const noTravel = scored.filter(k => !within(k, trav, 3));
  const afterGluten = scored.filter(k => within(k, k2 => k2 !== k && glu(k2), 2));
  const noGluten = scored.filter(k => !within(k, glu, 2));
  const poorSleep = all.filter(k => sc(k, "sleep") != null && sc(k, "sleep") <= 4);
  const goodSleep = all.filter(k => sc(k, "sleep") != null && sc(k, "sleep") >= 6);
  const waterMet = all.filter(k => (days[k].water || 0) >= waterGlasses() && sc(k, "dizzy") != null);
  const waterMiss = all.filter(k => (days[k].water || 0) < waterGlasses() && sc(k, "dizzy") != null);
  const sh = settings.goals.strengthHabit;
  const dayAfterStrength = all.filter(k => sc(k, "fatigue") != null && days[addDays(k, -1)] && days[addDays(k, -1)].done[sh]);
  const dayAfterRest = all.filter(k => sc(k, "fatigue") != null && days[addDays(k, -1)] && !days[addDays(k, -1)].done[sh]);
  const ex = k => (days[k] && days[k].extras) || [];
  const afterExtra = scored.filter(k => ex(addDays(k, -1)).length), noExtra = scored.filter(k => !ex(addDays(k, -1)).length);
  const saunaDay = k => ex(k).some(x => /sauna/i.test(x));
  const dz = all.filter(k => sc(k, "dizzy") != null);
  const sauna = dz.filter(saunaDay), noSauna = dz.filter(k => !saunaDay(k));
  const nearPeriod = k => { for (let i = 0; i <= 3; i++) if (isPeriod(addDays(k, i))) return true; return false; };
  const cycWin = scored.filter(nearPeriod), cycRest = scored.filter(k => !nearPeriod(k));
  const flareNearPeriod = all.filter(k => isFlare(k) && nearPeriod(k)).length;
  const highStress = all.filter(k => sc(k, "stress") != null && sc(k, "stress") >= 7);
  const lowStress = all.filter(k => sc(k, "stress") != null && sc(k, "stress") <= 4);

  // flare rate after travel
  const travelDays = all.filter(trav);
  let flareAfterTravel = 0;
  travelDays.forEach(k => { for (let i = 0; i <= 3; i++) if (isFlare(addDays(k, i))) { flareAfterTravel++; break; } });

  // flares
  const flares = all.filter(isFlare);
  const last90 = flares.filter(k => diffDays(k, t) < 90);
  const episodes = []; let ep = null;
  flares.forEach(k => { if (ep && diffDays(ep.end, k) === 1) ep.end = k; else { ep = { start: k, end: k }; episodes.push(ep); } });
  const avgLen = episodes.length ? avg(episodes.map(e => diffDays(e.start, e.end) + 1)) : 0;
  const tally = (field) => { const m = {}; flares.forEach(k => (days[k].flare[field] || []).forEach(x => m[x] = (m[x] || 0) + 1)); return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 6); };
  const trig = tally("triggers"), sym = tally("symptoms");
  const maxT = Math.max(1, ...trig.map(x => x[1])), maxS = Math.max(1, ...sym.map(x => x[1]));

  const p30 = avg(vals(keys30.filter(k => k >= addDays(t, -13)), "pain")), pPrev = avg(vals(keys30.filter(k => k < addDays(t, -13)), "pain"));
  const f14 = avg(vals(keys30.filter(k => k >= addDays(t, -13)), "fatigue"));

  return `<div class="stack">
    <div><div class="label">Insights</div><h1>Patterns in your days</h1></div>
    <div class="stats">
      <div class="stat"><b class="tnum">${p30 == null ? "–" : fmt1(p30)}</b><span>Avg pain, 14 days${p30 != null && pPrev != null ? ` (${p30 <= pPrev ? "↓" : "↑"} from ${fmt1(pPrev)})` : ""}</span></div>
      <div class="stat"><b class="tnum">${f14 == null ? "–" : fmt1(f14)}</b><span>Avg fatigue, 14 days</span></div>
      <div class="stat"><b class="tnum">${last90.length}</b><span>Flare days, 90 days</span></div>
    </div>

    <section class="card">
      <div class="row between"><h2>Last 30 days</h2></div>
      <div class="keyline" style="margin:8px 0"><span><i style="background:var(--primary)"></i>Pain</span><span><i style="background:var(--chart-2)"></i>Fatigue</span><span><i style="background:var(--danger);opacity:.35;height:8px"></i>Flare</span><span><i style="background:var(--chart-2);width:8px;height:8px;clip-path:polygon(50% 0,100% 100%,0 100%)"></i>Travel</span><span><i style="background:var(--rose);width:7px;height:7px;border-radius:50%"></i>Period</span></div>
      ${trendChart(keys30)}
    </section>

    ${(() => {
      const wk = [...Array(90)].map((_, i) => addDays(t, i - 89));
      const ch = weightChart(wk); if (!ch) return "";
      const ws = wk.filter(k => days[k] && days[k].weight != null);
      const first = toUnit(days[ws[0]].weight), last = toUnit(days[ws[ws.length - 1]].weight), dlt = last - first;
      return `<section class="card"><div class="row between"><h2>Weight, 90 days</h2><span class="note tnum">${fmt1(last)} ${settings.weightUnit} · ${dlt === 0 ? "steady" : (dlt > 0 ? "+" : "−") + fmt1(Math.abs(dlt))} since ${parseKey(ws[0]).toLocaleDateString(undefined, { day: "numeric", month: "short" })}</span></div><div style="margin-top:8px">${ch}</div></section>`;
    })()}

    <div class="section-head"><h2>Possible links</h2></div>
    <section class="card">
      ${cmpBlock("Travel and pain", "Travel day + 3 days after", vals(afterTravel, "pain"), "Other days", vals(noTravel, "pain"), "pain")}
      ${travelDays.length ? `<div class="finding"><span class="badge ${flareAfterTravel ? "pattern" : "none"}">Flares after travel</span><p style="margin:0">${flareAfterTravel} of ${travelDays.length} travel day${travelDays.length === 1 ? "" : "s"} were followed by a flare within 3 days.</p></div>` : ""}
      ${cmpBlock("Gluten and pain", "1–2 days after gluten", vals(afterGluten, "pain"), "No recent gluten", vals(noGluten, "pain"), "pain")}
      ${cmpBlock("Sleep and pain", "After poor sleep (0–4)", vals(poorSleep, "pain"), "After good sleep (6–10)", vals(goodSleep, "pain"), "pain")}
      ${cmpBlock("Hydration and dizziness", "Water target missed", vals(waterMiss, "dizzy"), "Water target met", vals(waterMet, "dizzy"), "dizziness")}
      ${cmpBlock("Strength sessions and next-day fatigue", "Day after strength", vals(dayAfterStrength, "fatigue"), "Day after no session", vals(dayAfterRest, "fatigue"), "fatigue")}
      ${cmpBlock("Extras and next-day pain", "Day after an extra", vals(afterExtra, "pain"), "Other days", vals(noExtra, "pain"), "pain")}
      ${cmpBlock("Sauna heat and dizziness", "Sauna days", vals(sauna, "dizzy"), "Other days", vals(noSauna, "dizzy"), "dizziness")}
      ${habits().some(h => h.id === "melatonin") ? (() => {
        const after = (k, v) => vlist(days[addDays(k, -1)] && days[addDays(k, -1)].done.melatonin).includes(v);
        const sl = all.filter(k => sc(k, "sleep") != null);
        return cmpBlock("Melatonin dose and sleep", "After 2 tablets", vals(sl.filter(k => after(k, "2 tablets")), "sleep"), "After 1 tablet", vals(sl.filter(k => after(k, "1 tablet") && !after(k, "2 tablets")), "sleep"), "sleep quality", false);
      })() : ""}
      ${cmpBlock("Your cycle and pain", "Period + 3 days before", vals(cycWin, "pain"), "Rest of cycle", vals(cycRest, "pain"), "pain")}
      ${cycleStarts().length && flares.length ? `<div class="finding"><span class="badge none">Flares and your cycle</span><p style="margin:0">${flareNearPeriod} of ${flares.length} flare day${flares.length === 1 ? "" : "s"} fell during a period or the 3 days before one.</p></div>` : ""}
      ${cmpBlock("Stress and pain", "High-stress days (7+)", vals(highStress, "pain"), "Calmer days (0–4)", vals(lowStress, "pain"), "pain")}
    </section>

    ${(() => {
      const od = all.filter(k => days[k].oura);
      if (!od.length) return "";
      const pre = new Set(), near = new Set();
      episodes.forEach(e => { pre.add(addDays(e.start, -1)); pre.add(addDays(e.start, -2)); });
      flares.forEach(k => { for (let i = -2; i <= 2; i++) near.add(addDays(k, i)); });
      const M = [["hrv", "HRV", " ms"], ["rhr", "Resting HR", " bpm"], ["readiness", "Readiness", ""], ["tempDev", "Temperature", " °C"], ["sleepScore", "Sleep score", ""]];
      const ov = (ks, m) => ks.map(k => days[k].oura[m]).filter(v => v != null);
      const preDays = od.filter(k => pre.has(k)), calm = od.filter(k => !near.has(k));
      const enough = episodes.filter(e => pre.has(addDays(e.start, -1)) && days[addDays(e.start, -1)] && days[addDays(e.start, -1)].oura).length >= 2;
      return `<div class="section-head"><h2>Oura before flares</h2></div><section class="card">
        ${enough ? `<div style="overflow-x:auto"><table class="otable tnum"><thead><tr><th></th><th>1–2 days before a flare</th><th>Calm days</th></tr></thead><tbody>
          ${M.map(([m, l, u]) => { const a = avg(ov(preDays, m)), b = avg(ov(calm, m)); return `<tr><td>${l}</td><td>${a == null ? "–" : (m === "tempDev" ? a.toFixed(2) : fmt1(a)) + u}</td><td>${b == null ? "–" : (m === "tempDev" ? b.toFixed(2) : fmt1(b)) + u}</td></tr>`; }).join("")}
        </tbody></table></div><p class="note" style="margin:10px 0 0">Lower HRV and readiness, or a higher resting heart rate and temperature, in the days before flares could be an early warning worth watching for.</p>`
        : `<p class="muted" style="margin:0">Once Oura data covers at least 2 flares, this compares your ring's readings in the 2 days before a flare with calm days. It can show whether your body gives early warning signs.</p>`}
      </section>`;
    })()}

    <div class="section-head"><h2>Flares</h2><span class="note tnum">${episodes.length} episode${episodes.length === 1 ? "" : "s"}${episodes.length ? `, avg ${fmt1(avgLen)} days` : ""}</span></div>
    <section class="card">
      ${flares.length ? `<div class="stack" style="gap:16px">
        <div><div class="label" style="margin-bottom:8px">Triggers you've noted</div><div class="tally">${trig.length ? trig.map(([n, c]) => `<div class="row"><span>${esc(n)}</span><div class="bar due"><i style="width:${c / maxT * 100}%"></i></div><b class="tnum">${c}</b></div>`).join("") : `<span class="note">No triggers tagged yet.</span>`}</div></div>
        <div><div class="label" style="margin-bottom:8px">Most common symptoms</div><div class="tally">${sym.length ? sym.map(([n, c]) => `<div class="row"><span>${esc(n)}</span><div class="bar"><i style="width:${c / maxS * 100}%;background:var(--danger)"></i></div><b class="tnum">${c}</b></div>`).join("") : `<span class="note">No symptoms tagged yet.</span>`}</div></div>
      </div>` : `<p class="muted" style="margin:0">No flares logged. When one happens, switch on Flare-up on the Today tab and tag symptoms and likely triggers.</p>`}
    </section>
    <p class="note">These comparisons show what tends to happen together in your own log. They can't prove cause, and small groups can mislead. They're a starting point for conversations with your care team.</p>
  </div>`;
}

/* ---------- plan / settings ---------- */
function schedEditor(h, i) {
  const s = sched(h), id = esc(h.id), t = todayKey();
  let body = "";
  if (s.type === "weekly") {
    body = `<div class="days chips">${[1, 2, 3, 4, 5, 6, 0].map(n => `<button class="chip" data-act="hday" data-id="${id}" data-n="${n}" aria-pressed="${!!(s.days && s.days.includes(n))}">${DOW[n].slice(0, 2)}</button>`).join("")}</div>`;
  } else if (s.type === "interval") {
    const nd = scheduled(h, t) ? 0 : nextDue(h, t);
    body = `<div class="grid2">
      <label class="field" for="se-${i}"><span>Every (days)</span><input type="number" id="se-${i}" min="1" data-sch="every" data-id="${id}" value="${s.every || 14}"></label>
      <label class="field" for="ss-${i}"><span>First / last taken</span><input type="date" id="ss-${i}" data-sch="start" data-id="${id}" value="${s.start || t}"></label></div>
      <p class="note" style="margin:0">${nd === 0 ? "Due today." : nd != null ? `Next due in ${nd} day${nd === 1 ? "" : "s"}.` : ""}</p>`;
  } else if (s.type === "cycle") {
    const ph = cyclePhase(h, t);
    body = `<div class="grid2">
      <label class="field" for="sa-${i}"><span>Restart when my period starts</span><select id="sa-${i}" data-sch="anchor" data-id="${id}"><option value="" ${s.anchor !== "period" ? "selected" : ""}>No</option><option value="period" ${s.anchor === "period" ? "selected" : ""}>Yes</option></select></label>
      ${s.anchor === "period" ? `<label class="field" for="so-${i}"><span>Days after period starts</span><input type="number" id="so-${i}" min="0" data-sch="offset" data-id="${id}" value="${s.offset ?? 0}"></label>` : ""}
      </div>
      <label class="field" for="ss-${i}"><span>${s.anchor === "period" ? "Current cycle started on (until a period is logged)" : "Cycle started on"}</span><input type="date" id="ss-${i}" data-sch="start" data-id="${id}" value="${s.start || t}"></label>
      ${(s.phases || []).map((p, pi) => `<div class="phase">
        <label class="field" for="pd-${i}-${pi}"><span>Step ${pi + 1} dose</span><input type="text" id="pd-${i}-${pi}" data-ph="dose" data-pi="${pi}" data-id="${id}" value="${esc(p.dose)}" placeholder="Leave empty for a break"></label>
        <label class="field" for="pl-${i}-${pi}"><span>Days</span><input type="number" id="pl-${i}-${pi}" min="1" data-ph="days" data-pi="${pi}" data-id="${id}" value="${p.days}"></label>
        <button class="btn sm ghost" data-act="phdel" data-id="${id}" data-n="${pi}" ${(s.phases || []).length <= 1 ? "disabled" : ""} aria-label="Remove step ${pi + 1}">✕</button></div>`).join("")}
      <div class="row"><button class="btn sm ghost" data-act="phadd" data-id="${id}">Add step</button>
      <span class="note">${ph ? `Today: ${esc(ph.dose || "break")}, day ${ph.day} of ${ph.len}` : "Starts on the date above"}</span></div>`;
  }
  return `<label class="field" for="sty-${i}"><span>Repeats</span><select id="sty-${i}" data-sch="type" data-id="${id}">
      ${[["daily", "Every day"], ["weekly", "On certain weekdays"], ["interval", "Every few days (e.g. fortnightly)"], ["cycle", "Dose cycle (e.g. 2 tablets 2 wks, 1 tablet 2 wks)"]].map(([v, l]) => `<option value="${v}" ${s.type === v ? "selected" : ""}>${l}</option>`).join("")}
    </select></label>${body}`;
}

function supplyEditor(h, i) {
  const s = h.stock || {}, si = stockInfo(h), id = esc(h.id);
  const sum = !si ? "Fill in “On hand now” to get a reminder before you run out."
    : !si.lastCovered ? `None left. ${si.runOut ? "Needed " + shortDate(si.runOut) + "." : ""}`
    : si.runOut ? `${si.left} ${esc(si.unit)} left, enough until ${shortDate(si.lastCovered)}. Reminder from ${shortDate(si.reorderBy)}.`
    : `${si.left} ${esc(si.unit)} left, enough for over a year.`;
  return `<div class="field"><span>Supply (optional, for reorder reminders)</span>
    <div class="grid2">
      <label class="field" for="kc-${i}"><span>On hand now</span><input type="number" id="kc-${i}" min="0" step="any" inputmode="decimal" data-stk="count" data-id="${id}" value="${si ? si.left : ""}" placeholder="e.g. 4"></label>
      <label class="field" for="ku-${i}"><span>Unit</span><input type="text" id="ku-${i}" data-stk="unit" data-id="${id}" value="${esc(s.unit || "")}" placeholder="doses, tablets, ml"></label>
      <label class="field" for="kp-${i}"><span>Used per dose</span><input type="number" id="kp-${i}" min="0" step="any" data-stk="perDose" data-id="${id}" value="${s.perDose ?? 1}"></label>
      <label class="field" for="kk-${i}"><span>Pack size</span><input type="number" id="kk-${i}" min="0" step="any" data-stk="pack" data-id="${id}" value="${s.pack ?? ""}"></label>
      <label class="field" for="kl-${i}"><span>Remind me (days ahead)</span><input type="number" id="kl-${i}" min="0" data-stk="lead" data-id="${id}" value="${s.lead ?? 7}"></label>
    </div>
    <p class="note" style="margin:0">${sum}</p></div>`;
}

function vPlan() {
  const list = habits().map((h, i) => {
    const open = editOpen === h.id;
    return `<details class="hedit" ${open ? "open" : ""} data-hid="${esc(h.id)}">
      <summary data-act="openedit" data-id="${esc(h.id)}">${esc(h.name)}<span class="tag">${(TIMES.find(t => t[0] === h.time) || TIMES[0])[1]}</span></summary>
      <div class="body">
        <label class="field" for="hn-${i}"><span>Name</span><input type="text" id="hn-${i}" data-hfield="name" data-id="${esc(h.id)}" value="${esc(h.name)}"></label>
        <label class="field" for="hd-${i}"><span>Detail (optional)</span><input type="text" id="hd-${i}" data-hfield="detail" data-id="${esc(h.id)}" value="${esc(h.detail)}"></label>
        <div class="grid2">
          <label class="field" for="hc-${i}"><span>Type</span><select id="hc-${i}" data-hfield="cat" data-id="${esc(h.id)}">${Object.entries(CATS).map(([v, l]) => `<option value="${v}" ${h.cat === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
          <label class="field" for="ht-${i}"><span>Time of day</span><select id="ht-${i}" data-hfield="time" data-id="${esc(h.id)}">${TIMES.map(([v, l]) => `<option value="${v}" ${h.time === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        </div>
        ${schedEditor(h, i)}
        <label class="field" for="hv-${i}"><span>Options to pick when ticking (optional, comma-separated)</span><input type="text" id="hv-${i}" data-hfield="variants" data-id="${esc(h.id)}" value="${esc((h.variants || []).join(", "))}" placeholder="e.g. Physio, Osteo"></label>
        ${supplyEditor(h, i)}
        <div class="row">
          <button class="btn sm ghost" data-act="hmove" data-id="${esc(h.id)}" data-n="-1" ${i === 0 ? "disabled" : ""}>Move up</button>
          <button class="btn sm ghost" data-act="hmove" data-id="${esc(h.id)}" data-n="1" ${i === habits().length - 1 ? "disabled" : ""}>Move down</button>
          <button class="btn sm ghost" style="margin-left:auto;color:var(--danger)" data-act="hdel" data-id="${esc(h.id)}">Remove</button>
        </div>
        ${confirmDel === h.id ? `<div class="confirm">Remove "${esc(h.name)}"? Past ticks stay in your history.<button class="btn sm danger" data-act="hdelyes" data-id="${esc(h.id)}">Remove</button><button class="btn sm ghost" data-act="hdelno">Keep</button></div>` : ""}
      </div></details>`;
  }).join("");
  const r = settings.retainer, w = settings.water, g = settings.goals;
  return `<div class="stack">
    <div><div class="label">My plan</div><h1>Your daily routine</h1></div>
    <section class="card">
      <div class="row between"><h2>Habits</h2><button class="btn sm" data-act="hadd">Add habit</button></div>
      <div style="margin-top:6px">${list}</div>
    </section>

    <section class="card stack">
      <div><h2>Extras</h2><p class="note" style="margin:4px 0 0">Optional things you log when you do them. They show up in Insights but never count against a streak.</p></div>
      <div>${(settings.extras || []).map(x => `<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span style="font-weight:600">${esc(x)}</span><button class="btn sm ghost" data-act="exdel" data-v="${esc(x)}">Remove</button></div>`).join("")}</div>
      <form class="row" style="flex-wrap:nowrap" onsubmit="event.preventDefault();document.querySelector('[data-act=exadd]').click()"><input type="text" id="ex-new" placeholder="e.g. Cold plunge" aria-label="New extra"><button class="btn sm" type="button" data-act="exadd">Add</button></form>
    </section>

    <section class="card stack">
      <h2>Targets</h2>
      <div class="grid2">
        <label class="field" for="w-t"><span>Water per day (ml)</span><input type="number" id="w-t" min="500" step="100" data-sfield="water.targetMl" value="${w.targetMl}"></label>
        <label class="field" for="w-g"><span>Glass size (ml)</span><input type="number" id="w-g" min="50" step="50" data-sfield="water.glassMl" value="${w.glassMl}"></label>
        <label class="field" for="g-s"><span>Strength sessions / week</span><input type="number" id="g-s" min="1" max="7" data-sfield="goals.strengthPerWeek" value="${g.strengthPerWeek}"></label>
        <label class="field" for="g-p"><span>Steady day threshold (%)</span><input type="number" id="g-p" min="50" max="100" step="5" data-sfield="goals.steadyPct" value="${g.steadyPct}"></label>
      </div>
      <label class="field" for="w-u"><span>Weight unit</span><select id="w-u" data-sfield="weightUnit"><option value="kg" ${settings.weightUnit !== "lb" ? "selected" : ""}>Kilograms (kg)</option><option value="lb" ${settings.weightUnit === "lb" ? "selected" : ""}>Pounds (lb)</option></select></label>
      <label class="field" for="g-h"><span>Habit that counts as a strength session</span><select id="g-h" data-sfield="goals.strengthHabit">${habits().map(h => `<option value="${esc(h.id)}" ${g.strengthHabit === h.id ? "selected" : ""}>${esc(h.name)}</option>`).join("")}</select></label>
    </section>

    <section class="card stack">
      <h2>Retainers</h2>
      <div class="grid2">
        <label class="field" for="r-s"><span>Current set number</span><input type="number" id="r-s" min="1" data-sfield="retainer.set" value="${r.set}"></label>
        <label class="field" for="r-i"><span>Swap every (days)</span><input type="number" id="r-i" min="1" data-sfield="retainer.interval" value="${r.interval}"></label>
      </div>
      <label class="field" for="r-l"><span>Started current set on</span><input type="date" id="r-l" data-sfield="retainer.lastSwap" value="${r.lastSwap}"></label>
    </section>

    ${ouraPlanCard()}

    <section class="card stack">
      <h2>Your data</h2>
      <p style="margin:0" class="muted">${inClaude() ? "Entries are stored in your own private space. Anyone else who opens this page gets a separate, empty log and can't see yours." : "Entries are saved only in this browser on this device. Clearing site data deletes them, so export a backup now and then."} Export a copy to take to appointments.</p>
      ${downloads || !inClaude() ? `<div class="row"><button class="btn sm" data-act="export-csv">Export CSV</button><button class="btn sm ghost" data-act="export-json">Export backup (JSON)</button></div>` : `<p class="note" style="margin:0">Exporting isn't available in this view.</p>`}
    </section>
    <p class="note">Steady is a personal log, not medical advice. Talk to your clinician before changing medication, supplements or exercise.</p>
  </div>`;
}

/* ---------- events ---------- */
function setPath(obj, path, val) { const p = path.split("."); let o = obj; for (let i = 0; i < p.length - 1; i++) o = o[p[i]] ||= {}; o[p[p.length - 1]] = val; }
function toggleIn(arr, v) { const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); return arr; }

document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  view = b.dataset.tab; if (view === "today") curDay = curDay || todayKey();
  render(); window.scrollTo(0, 0);
});

document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, k = curDay;
  if (act === "openedit") { e.preventDefault(); editOpen = editOpen === b.dataset.id ? null : b.dataset.id; confirmDel = null; render(); return; }
  const d = ["tick", "tickv", "period", "csx", "extra", "water", "flare", "fsev", "fsym", "ftrig", "travel", "ttype", "gluten", "sublux"].includes(act) ? day(k) : null;
  switch (act) {
    case "tick": d.done[b.dataset.id] ? delete d.done[b.dataset.id] : d.done[b.dataset.id] = true; saveDay(k); render();
      if (dayProgress(k).pct >= 1 && d.done[b.dataset.id]) toast("Everything done. Lovely work."); break;
    case "tickv": { const vl = toggleIn([...vlist(d.done[b.dataset.id])], b.dataset.v); if (vl.length) d.done[b.dataset.id] = vl; else delete d.done[b.dataset.id]; saveDay(k); render(); }
      if (dayProgress(k).pct >= 1 && d.done[b.dataset.id]) toast("Everything done. Lovely work."); break;
    case "period": d.period = b.dataset.v || null; saveDay(k); render(); break;
    case "csx": toggleIn(d.cycleSx ||= [], b.dataset.v); saveDay(k); render(); break;
    case "restock": { const h = habits().find(x => x.id === b.dataset.id), si = stockInfo(h); if (!si) break;
      h.stock = { ...h.stock, count: si.left + si.pack, asOf: stockAsOfNow(h) }; saveSettings(); render(); toast(`${h.name}: ${si.left + si.pack} ${si.unit} on hand`); break; }
    case "editsupply": view = "plan"; editOpen = b.dataset.id; confirmDel = null; render();
      setTimeout(() => { const el = document.querySelector(`[data-stk="count"][data-id="${b.dataset.id}"]`); if (el) el.scrollIntoView({ block: "center" }); }, 30); break;
    case "ouraconnect": ouraConnect(); break;
    case "ourasync": ouraSync(true); break;
    case "ouraoff": ouraSave(null); ouraMsg = ""; render(); toast("Oura disconnected. Synced data stays in your log."); break;
    case "extra": toggleIn(d.extras ||= [], b.dataset.v); saveDay(k); render(); break;
    case "exdel": settings.extras = (settings.extras || []).filter(x => x !== b.dataset.v); saveSettings(); render(); break;
    case "exadd": { const el = document.getElementById("ex-new"); const v = (el.value || "").trim(); if (!v) { el.focus(); break; }
      if ((settings.extras ||= []).includes(v)) { toast(v + " is already on the list"); break; } settings.extras.push(v); saveSettings(); render(); toast("Added " + v); break; }
    case "phadd": { const h = habits().find(x => x.id === b.dataset.id); const s = { ...sched(h) }; s.phases = [...(s.phases || []), { dose: "", days: 14 }]; h.sched = s; delete h.days; saveSettings(); render(); break; }
    case "phdel": { const h = habits().find(x => x.id === b.dataset.id); const s = { ...sched(h) }; s.phases = (s.phases || []).filter((_, j) => j !== Number(b.dataset.n)); h.sched = s; saveSettings(); render(); break; }
    case "water": d.water = Math.max(0, (d.water || 0) + Number(b.dataset.n)); saveDay(k); render();
      if (d.water === waterGlasses() && b.dataset.n === "1") toast("Hydration target reached"); break;
    case "sublux": d.sublux = Math.max(0, (d.sublux || 0) + Number(b.dataset.n)); saveDay(k); render(); break;
    case "flare": d.flare = d.flare ? null : { severity: "Moderate", symptoms: [], triggers: d.travel ? ["Travel"] : [] }; saveDay(k); render(); break;
    case "fsev": d.flare.severity = b.dataset.v; saveDay(k); render(); break;
    case "fsym": toggleIn(d.flare.symptoms ||= [], b.dataset.v); saveDay(k); render(); break;
    case "ftrig": toggleIn(d.flare.triggers ||= [], b.dataset.v); saveDay(k); render(); break;
    case "travel": d.travel = d.travel ? null : { type: "Flight" }; saveDay(k); render(); break;
    case "ttype": d.travel.type = b.dataset.v; saveDay(k); render(); break;
    case "gluten": d.gluten = b.dataset.v; saveDay(k); render(); break;
    case "day": { const n = Number(b.dataset.n); curDay = n === 0 ? todayKey() : addDays(curDay, n); if (curDay > todayKey()) curDay = todayKey(); render(); window.scrollTo(0, 0); break; }
    case "goto": curDay = b.dataset.k; view = "today"; render(); window.scrollTo(0, 0); break;
    case "swap": settings.retainer.set += 1; settings.retainer.lastSwap = todayKey(); saveSettings(); render(); toast("Now on set " + settings.retainer.set); break;
    case "hday": { const h = habits().find(x => x.id === b.dataset.id); const n = Number(b.dataset.n); const s = sched(h); h.sched = { type: "weekly", days: toggleIn(s.days ? [...s.days] : [], n).sort() }; delete h.days; saveSettings(); render(); break; }
    case "hmove": { const hs = habits(); const i = hs.findIndex(x => x.id === b.dataset.id); const j = i + Number(b.dataset.n); if (j < 0 || j >= hs.length) break; [hs[i], hs[j]] = [hs[j], hs[i]]; saveSettings(); render(); break; }
    case "hdel": confirmDel = b.dataset.id; render(); break;
    case "hdelno": confirmDel = null; render(); break;
    case "hdelyes": settings.habits = habits().filter(x => x.id !== b.dataset.id); confirmDel = null; editOpen = null; saveSettings(); render(); toast("Habit removed"); break;
    case "hadd": { const id = "h" + Date.now().toString(36); settings.habits.push({ id, name: "New habit", detail: "", cat: "care", time: "morning", days: null }); editOpen = id; saveSettings(); render();
      setTimeout(() => { const el = document.querySelector(`[data-hfield="name"][data-id="${id}"]`); if (el) { el.focus(); el.select(); el.scrollIntoView({ block: "center" }); } }, 30); break; }
    case "export-csv": exportCSV(); break;
    case "export-json": exportJSON(); break;
  }
});

document.getElementById("app").addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.score) {
    const s = SCORES.find(x => x.k === el.dataset.score), v = Number(el.value);
    day(curDay).scores[s.k] = v;
    const wrap = el.closest(".score"); wrap.className = "score " + scoreClass(s, v);
    document.getElementById("scv-" + s.k).textContent = v;
    saveDay(curDay);
  } else if (el.dataset.field) {
    const d = day(curDay);
    if (el.dataset.field === "notes") d.notes = el.value;
    else if (el.dataset.field === "weight") { const v = parseFloat(el.value); d.weight = isFinite(v) && v > 0 ? Math.round(fromUnit(v) * 100) / 100 : null; }
    else setPath(d, el.dataset.field, el.value === "" ? null : Number(el.value));
    saveDay(curDay);
  } else if (el.dataset.hfield && el.tagName === "INPUT" && el.dataset.hfield !== "variants") {
    const h = habits().find(x => x.id === el.dataset.id); h[el.dataset.hfield] = el.value;
    const sum = el.closest("details").querySelector("summary"); sum.firstChild.textContent = el.value || "Untitled";
    saveSettings();
  }
});
document.getElementById("app").addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.hfield === "variants") {
    const h = habits().find(x => x.id === el.dataset.id);
    const v = el.value.split(",").map(s => s.trim()).filter(Boolean);
    if (v.length) h.variants = v; else delete h.variants;
    saveSettings(); render(); return;
  }
  if (el.dataset.sch) {
    const h = habits().find(x => x.id === el.dataset.id), s = { ...sched(h) }, f = el.dataset.sch;
    if (f === "type") {
      s.type = el.value;
      if (s.type === "interval") { s.every ||= 14; s.start ||= todayKey(); }
      if (s.type === "cycle") { s.start ||= todayKey(); if (!s.phases || !s.phases.length) s.phases = [{ dose: "2 tablets", days: 14 }, { dose: "1 tablet", days: 14 }]; }
      if (s.type === "weekly") s.days ||= [];
    } else if (f === "anchor") { if (el.value) { s.anchor = "period"; s.offset ??= 0; } else delete s.anchor; }
    else if (f === "offset") { const n = Math.round(Number(el.value)); if (!(n >= 0)) { toast("Enter 0 or more days"); render(); return; } s.offset = n; }
    else if (f === "every") { const n = Math.round(Number(el.value)); if (!(n >= 1)) { toast("Enter a number of days, 1 or more"); render(); return; } s.every = n; }
    else if (f === "start") { if (!el.value) { render(); return; } s.start = el.value; }
    h.sched = s; delete h.days; saveSettings(); render(); return;
  }
  if (el.dataset.stk) {
    const h = habits().find(x => x.id === el.dataset.id), f = el.dataset.stk, s = { ...(h.stock || {}) };
    if (f === "unit") s.unit = el.value.trim();
    else if (el.value === "") { if (f === "count") { delete h.stock; saveSettings(); render(); return; } delete s[f]; }
    else { const n = Number(el.value); if (!(n >= 0)) { toast("Enter 0 or more"); render(); return; } s[f] = n; if (f === "count") s.asOf = stockAsOfNow(h); }
    h.stock = s; saveSettings(); render(); return;
  }
  if (el.dataset.ph) {
    const h = habits().find(x => x.id === el.dataset.id), s = { ...sched(h) };
    s.phases = (s.phases || []).map(p => ({ ...p }));
    const p = s.phases[Number(el.dataset.pi)];
    if (el.dataset.ph === "days") { const n = Math.round(Number(el.value)); if (!(n >= 1)) { toast("Enter a number of days, 1 or more"); render(); return; } p.days = n; }
    else p.dose = el.value.trim();
    h.sched = s; saveSettings(); render(); return;
  }
  if (el.dataset.field === "weight") { render(); return; }
  if (el.dataset.hfield && el.tagName === "SELECT") { const h = habits().find(x => x.id === el.dataset.id); h[el.dataset.hfield] = el.value; saveSettings(); render(); }
  else if (el.dataset.hfield === "name" && !el.value.trim()) { const h = habits().find(x => x.id === el.dataset.id); h.name = "Untitled"; saveSettings(); render(); }
  else if (el.dataset.sfield) {
    let v = el.value;
    if (el.type === "number") { v = Number(v); if (!isFinite(v) || v <= 0) { toast("Enter a number above 0"); render(); return; } }
    if (el.type === "date" && !v) { render(); return; }
    setPath(settings, el.dataset.sfield, v); saveSettings(); render();
  }
});

/* ---------- Oura (GitHub Pages version only, via the steady-oura helper) ---------- */
const OURA_HELPER = ""; // set once the helper is deployed, e.g. https://steady-oura.<name>.workers.dev
const OURA_LS = "steady.oura";
let ouraBusy = false, ouraMsg = "";
function ouraState() { try { return JSON.parse(localStorage.getItem(OURA_LS) || "null"); } catch { return null; } }
function ouraSave(s) { try { s ? localStorage.setItem(OURA_LS, JSON.stringify(s)) : localStorage.removeItem(OURA_LS); } catch {} }
const ouraReady = () => !inClaude() && !!OURA_HELPER;
const redirectUri = () => location.origin + location.pathname;

async function ouraConnect() {
  try {
    const cfg = await fetch(OURA_HELPER + "/config").then(r => r.json());
    const st = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { sessionStorage.setItem("steady.oura.state", st); } catch {}
    location.href = "https://cloud.ouraring.com/oauth/authorize?" + new URLSearchParams({ response_type: "code", client_id: cfg.client_id, redirect_uri: redirectUri(), scope: "daily heartrate personal", state: st });
  } catch (e) { toast("Couldn't reach the Oura helper. Check your connection."); }
}
async function ouraHandleRedirect() {
  const p = new URLSearchParams(location.search);
  if (!p.has("code") && !p.has("error")) return false;
  history.replaceState(null, "", location.pathname);
  if (p.get("error")) { toast("Oura connection cancelled"); return false; }
  let expected = null; try { expected = sessionStorage.getItem("steady.oura.state"); } catch {}
  if (!expected || expected !== p.get("state")) { toast("Oura connection didn't complete. Try Connect again."); return false; }
  try {
    const r = await fetch(OURA_HELPER + "/token", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: p.get("code"), redirect_uri: redirectUri() }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.access_token) { toast("Oura connection failed: " + (j.error_description || j.error || r.status)); return false; }
    ouraSave({ access: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 86400) * 1000, last: null });
    toast("Oura connected");
    return true;
  } catch { toast("Couldn't reach the Oura helper. Try again."); return false; }
}
async function ouraRefresh(s) {
  const r = await fetch(OURA_HELPER + "/refresh", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: s.refresh }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) throw new Error("expired");
  Object.assign(s, { access: j.access_token, refresh: j.refresh_token || s.refresh, exp: Date.now() + (j.expires_in || 86400) * 1000 });
  ouraSave(s);
}
async function ouraGet(s, path, start, end) {
  if (Date.now() > s.exp - 60000) await ouraRefresh(s);
  const base = OURA_HELPER + "/v2/usercollection/" + path + "?" + new URLSearchParams({ start_date: start, end_date: end });
  const get = u => fetch(u, { headers: { Authorization: "Bearer " + s.access } });
  let r = await get(base);
  if (r.status === 401) { await ouraRefresh(s); r = await get(base); }
  if (!r.ok) throw new Error("HTTP " + r.status);
  let j = await r.json(); const out = [...(j.data || [])];
  for (let n = 0; j.next_token && n < 20; n++) { const r2 = await get(base + "&next_token=" + encodeURIComponent(j.next_token)); if (!r2.ok) break; j = await r2.json(); out.push(...(j.data || [])); }
  return out;
}
async function ouraSync(manual) {
  const s = ouraState(); if (!ouraReady() || !s || ouraBusy) return;
  if (!manual && s.lastAt && Date.now() - s.lastAt < 30 * 60000) return;
  ouraBusy = true; ouraMsg = "Syncing…"; if (view === "plan") render();
  const t = todayKey();
  try {
    const start = s.last ? addDays(s.last, -3) : addDays(t, -60), end = addDays(t, 1);
    const [ds, dr, sl, da] = await Promise.all(["daily_sleep", "daily_readiness", "sleep", "daily_activity"].map(p => ouraGet(s, p, start, end)));
    const m = {}, g = k => (m[k] ||= {});
    ds.forEach(x => { if (x.score != null) g(x.day).sleepScore = x.score; });
    dr.forEach(x => { const o = g(x.day); if (x.score != null) o.readiness = x.score; if (x.temperature_deviation != null) o.tempDev = Math.round(x.temperature_deviation * 100) / 100; });
    const main = {}; sl.forEach(x => { if (!main[x.day] || (x.total_sleep_duration || 0) > (main[x.day].total_sleep_duration || 0)) main[x.day] = x; });
    Object.values(main).forEach(x => { const o = g(x.day); if (x.average_hrv != null) o.hrv = Math.round(x.average_hrv); if (x.lowest_heart_rate != null) o.rhr = x.lowest_heart_rate; if (x.total_sleep_duration) o.sleepHrs = Math.round(x.total_sleep_duration / 360) / 10; });
    da.forEach(x => { if (x.steps != null) g(x.day).steps = x.steps; });
    let n = 0;
    Object.entries(m).forEach(([k, o]) => {
      if (k > t) return;
      const d = day(k), before = JSON.stringify(d.oura || {});
      d.oura = { ...(d.oura || {}), ...o };
      if (o.sleepScore != null && d.scores.sleep == null) d.scores.sleep = Math.round(o.sleepScore / 10);
      if (JSON.stringify(d.oura) !== before) { n++; saveDay(k); }
    });
    s.last = t; s.lastAt = Date.now(); ouraSave(s);
    ouraMsg = `Last synced ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}${n ? `, ${n} day${n === 1 ? "" : "s"} updated` : ""}`;
    if (manual) toast("Oura synced");
  } catch (e) {
    console.warn(e);
    if (e.message === "expired") { ouraSave(null); ouraMsg = "Oura sign-in expired. Connect again below."; }
    else ouraMsg = "Couldn't reach Oura. Try Sync now later.";
  }
  ouraBusy = false; softRender();
}
function ouraTodayCard(d) {
  const o = d.oura; if (!o) return "";
  const items = [["Sleep", o.sleepScore, ""], ["Readiness", o.readiness, ""], ["HRV", o.hrv, " ms"], ["Resting HR", o.rhr, " bpm"],
    ["Temp", o.tempDev != null ? (o.tempDev > 0 ? "+" : o.tempDev < 0 ? "−" : "") + Math.abs(o.tempDev).toFixed(1) : null, " °C"], ["Asleep", o.sleepHrs, " h"], ["Steps", o.steps != null ? o.steps.toLocaleString() : null, ""]].filter(x => x[1] != null);
  return `<section class="card"><div class="row between"><h2>Oura</h2><span class="note">From your ring</span></div>
    <div class="ostats">${items.map(([l, v, u]) => `<div><b class="tnum">${v}<small>${u}</small></b><span>${l}</span></div>`).join("")}</div></section>`;
}
function ouraPlanCard() {
  if (inClaude()) return `<section class="card stack"><h2>Oura Ring</h2><p class="muted" style="margin:0">Oura sync works in the GitHub version of Steady, which you use on your phone.</p></section>`;
  const s = ouraState();
  return `<section class="card stack"><h2>Oura Ring</h2>
    ${!OURA_HELPER ? `<p class="muted" style="margin:0">Oura connection is being set up. Check back soon.</p>`
    : s ? `<p style="margin:0">Connected. Sleep, readiness, HRV, resting heart rate, temperature and steps sync each time you open Steady.</p>
        <p class="note" style="margin:0">${esc(ouraMsg || (s.lastAt ? "Last synced " + new Date(s.lastAt).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "Not synced yet"))}</p>
        <div class="row"><button class="btn sm" data-act="ourasync" ${ouraBusy ? "disabled" : ""}>${ouraBusy ? "Syncing…" : "Sync now"}</button><button class="btn sm ghost" data-act="ouraoff">Disconnect</button></div>`
    : `<p style="margin:0">Bring in sleep, readiness, HRV, resting heart rate, temperature and steps automatically. Your sleep score also fills in "Sleep quality" if you haven't logged it.</p>
        ${ouraMsg ? `<p class="note" style="margin:0">${esc(ouraMsg)}</p>` : ""}
        <div class="row"><button class="btn sm" data-act="ouraconnect">Connect Oura</button></div>`}
  </section>`;
}

/* ---------- export ---------- */
const inClaude = () => !!(window.claude && typeof window.claude.use === "function");
async function saveFile(filename, data) {
  if (!downloads && !inClaude()) {
    // standalone browser (e.g. GitHub Pages): ordinary download link
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".csv") ? "text/csv" : "application/json" }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("Saved " + filename); return;
  }
  if (!downloads) return;
  try { await downloads.save({ filename, data }); toast("Saved " + filename); }
  catch (e) { if (e && e.code !== "declined") toast("Couldn't save the file here"); }
}
function exportCSV() {
  const hs = habits();
  const head = ["date", "done_pct", ...SCORES.map(s => s.k), "water_glasses", "flare", "flare_severity", "flare_symptoms", "flare_triggers", "travel", "travel_hours", "time_zones", "gluten", "subluxations", "weight_" + (settings.weightUnit || "kg"), "period", "cycle_symptoms", "extras", "oura_sleep", "oura_readiness", "oura_hrv_ms", "oura_resting_hr", "oura_temp_dev", "oura_sleep_hours", "oura_steps", ...hs.map(h => h.name), "notes"];
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = Object.keys(days).sort().filter(k => meaningful(days[k])).map(k => {
    const d = days[k];
    return [k, Math.round(dayProgress(k).pct * 100), ...SCORES.map(s => d.scores[s.k]), d.water || 0, d.flare ? "yes" : "", d.flare?.severity, (d.flare?.symptoms || []).join("; "), (d.flare?.triggers || []).join("; "),
      d.travel?.type, d.travel?.hours, d.travel?.tz, d.gluten || "none", d.sublux || 0, d.weight != null ? fmt1(toUnit(d.weight)) : "", d.period || "", (d.cycleSx || []).join("; "), (d.extras || []).join("; "),
      ...["sleepScore", "readiness", "hrv", "rhr", "tempDev", "sleepHrs", "steps"].map(f => d.oura ? d.oura[f] : ""),
      ...hs.map(h => d.done[h.id] === true ? 1 : d.done[h.id] ? vlist(d.done[h.id]).join(" + ") : (scheduled(h, k) ? 0 : "")), d.notes].map(q).join(",");
  });
  saveFile("steady-log-" + todayKey() + ".csv", [head.map(q).join(","), ...rows].join("\n"));
}
function exportJSON() { saveFile("steady-backup-" + todayKey() + ".json", JSON.stringify({ exported: new Date().toISOString(), settings, days }, null, 2)); }

/* ---------- boot ---------- */
render();
connect();
if (ouraReady()) {
  ouraHandleRedirect().then(ok => ouraSync(ok));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") ouraSync(false); });
}
// roll over to the new day if the app stays open past midnight
let lastToday = todayKey();
setInterval(() => { const t = todayKey(); if (t !== lastToday) { if (curDay === lastToday) curDay = t; lastToday = t; softRender(); } }, 60000);
})();
</script>
